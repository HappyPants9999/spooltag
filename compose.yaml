# Paste into a new Dockhand stack. Fill in the <...> value.
# Everything else (Spoolman URL, tag base URL, locations, timeout, time zone, printers and
# storage) is set on the /settings page and kept in /data/spooltag.db.
services:
  spooltag:
    image: ghcr.io/happypants9999/spooltag:latest
    pull_policy: always                    # redeploys fetch the newest build
    container_name: spooltag
    restart: unless-stopped
    ports:
      - "7913:8000"
    volumes:
      - /appdata/spooltag:/data            # local disk, not an Unraid share
    # Optional starting values for a brand-new install, read only for settings the database
    # doesn't have yet. Once saved on /settings, these are ignored and can be deleted.
    # environment:
    #   SPOOLMAN_URL: http://<docker-vm-ip>:7912
    #   BASE_URL: http://<docker-vm-ip>:7913
    #   TZ: America/Denver
